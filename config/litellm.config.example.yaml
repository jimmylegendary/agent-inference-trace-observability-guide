# LiteLLM proxy config.
# LiteLLM should not be the raw prompt source of truth in this design.

litellm_settings:
  callbacks:
    - otel

  # Keep raw request/response logging off.
  log_raw_request_response: false
  turn_off_message_logging: true

  # Prevent callers from disabling logging of non-content observability fields.
  # Enable only if compatible with company policy.
  global_disable_no_log_param: true

general_settings:
  # Do not store prompts/responses in LiteLLM spend logs.
  store_prompts_in_spend_logs: false

router_settings:
  # Official LiteLLM proxy/router setting.
  # Enables pre-call checks such as context-window filtering and region/order
  # based routing behavior. This does not by itself preserve custom metadata;
  # OpenClaw correlation IDs must still be passed through request metadata or
  # headers and verified in traces/logs.
  enable_pre_call_checks: true

  # Optional pre-call checks are separate from enable_pre_call_checks.
  # Enable only when the deployed LiteLLM version and use case require them,
  # for example Responses API encrypted-content affinity or prompt-cache
  # deployment affinity.
  #
  # optional_pre_call_checks:
  #   - encrypted_content_affinity
