receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlphttp/langfuse:
    endpoint: ${LANGFUSE_OTEL_ENDPOINT}
    headers:
      Authorization: Basic ${LANGFUSE_AUTH}
      x-langfuse-ingestion-version: "4"

  otlp/tempo:
    endpoint: ${TEMPO_OTLP_ENDPOINT}
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/langfuse, otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
